<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="Browse through our collection of API endpoints.">
    <meta name="theme-color" content="#0a0a0a">
    <title>Zyrex Api</title>
    <link rel="icon" href="https://file.idnet.my.id/api/preview.php?file=nnjwax6t.jpg" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter','system-ui','sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        :root{
            --bg-main:#0a0a0a;
            --bg-card:#111111;
            --stroke:#222222;
            --accent-purple:#8b5cf6;
            --text-main:#ffffff;
            --text-muted:#a1a1aa;
        }

        body{
            background-color: var(--bg-main);
            background-image: 
                linear-gradient(var(--stroke) 1px, transparent 1px),
                linear-gradient(90deg, var(--stroke) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-main);
        }

        /* ================= LOADING SCREEN ================= */
        #loadingScreen{ background:linear-gradient(180deg,#1F2937,#263449); transition: opacity 0.5s ease; }
        .loader-wrapper{ position:relative; width:170px; height:170px; display:flex; align-items:center; justify-content:center; }
        .outer-ring{ position:absolute; width:160px; height:160px; border-radius:50%; border:6px solid transparent; border-top:6px solid #32D2FF; border-right:6px solid #32D2FF; animation:spinOuter 2.2s linear infinite; }
        .inner-ring{ position:absolute; width:90px; height:90px; border-radius:50%; border:5px solid transparent; border-bottom:5px solid #FF7A18; border-left:5px solid #FF7A18; animation:spinInner 1.8s linear infinite reverse; }
        @keyframes spinOuter{to{transform:rotate(360deg)}}
        @keyframes spinInner{to{transform:rotate(360deg)}}

        /* ================= STATS CARDS ================= */
        .stat-box {
            background: var(--bg-card);
            border: 1px solid var(--stroke);
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(139, 92, 246, 0.1);
            color: var(--accent-purple);
        }

        /* ================= TERMINAL SEARCH ================= */
        .terminal-window {
            background: #0d0d0d;
            border: 1px solid var(--stroke);
            border-radius: 8px;
            overflow: hidden;
        }
        .terminal-header {
            background: #1a1a1a;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--stroke);
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .input-modern {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            padding: 12px 15px;
            font-size: 13px;
        }

        /* ================= API CARD & TABS ================= */
        .api-card {
            background: var(--bg-card);
            border: 1px solid var(--stroke);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .api-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .api-content {
            background: #0a0a0a;
            border-top: 1px solid var(--stroke);
            padding: 20px;
        }

        /* Tab System Fix */
        .tabs-container {
            display: flex;
            gap: 20px;
            border-bottom: 1px solid var(--stroke);
            margin-bottom: 15px;
        }
        .tab-trigger {
            padding: 8px 0;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }
        .tab-trigger.active { color: var(--accent-purple); }
        .tab-trigger.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-purple);
        }

        .loader-request {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent-purple);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .response-media-container img { max-width: 100%; border-radius: 8px; margin-top: 10px; }
        .response-json { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #7ee787; white-space: pre-wrap; }
        
        /* Utility */
        .hidden { display: none !important; }

        .tab-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1a1a1a;
            border: 1px solid var(--stroke);
            color: #a1a1aa;
        }
        .tab-btn.active {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            color: white;
        }

        .contact-customer {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 55px;
            height: 55px;
            border-radius: 15px;
            background: var(--accent-purple);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
        }
    </style>
</head>

<body class="min-h-screen font-sans antialiased">

<div id="loadingScreen" class="fixed inset-0 flex items-center justify-center z-50">
    <div class="text-center">
        <div class="loader-wrapper mx-auto">
            <div class="outer-ring"></div>
            <div class="inner-ring"></div>
        </div>
        <h2 class="mt-8 text-xl font-bold tracking-widest text-white">Loading Rest Api</h2>
        <p class="mt-4 text-sm text-gray-400">Akan Masuk Ke Dalam • Rest Api</p>
    </div>
</div>

<main class="max-w-5xl mx-auto px-6 py-10">

    <header class="mb-10">
        <div class="flex items-center gap-2 mb-2">
            <h1 id="titleApi" class="text-3xl font-extrabold tracking-tight">Skyzopedia API</h1>
            <span class="text-[10px] bg-blue-600/20 text-blue-400 px-2 py-0.5 rounded border border-blue-600/30 font-mono">v1.0.0-x</span>
        </div>
        <p id="descApi" class="text-gray-400 text-sm">Interactive API documentation with real-time testing</p>
    </header>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
        <div class="stat-box">
            <div class="stat-icon"><i class="fas fa-code"></i></div>
            <div>
                <div id="totalEndpoints" class="text-xl font-bold">0</div>
                <div class="text-[10px] uppercase tracking-wider text-gray-500">Endpoints</div>
            </div>
        </div>
        <div class="stat-box">
            <div class="stat-icon"><i class="fas fa-layer-group"></i></div>
            <div>
                <div id="totalCategories" class="text-xl font-bold">0</div>
                <div class="text-[10px] uppercase tracking-wider text-gray-500">Categories</div>
            </div>
        </div>
        <div class="stat-box">
            <div class="stat-icon text-green-500 bg-green-500/10"><i class="fas fa-check-circle"></i></div>
            <div>
                <div class="text-xl font-bold">100%</div>
                <div class="text-[10px] uppercase tracking-wider text-gray-500">Status Ready</div>
            </div>
        </div>
        <div class="stat-box">
            <div class="stat-icon text-cyan-400 bg-cyan-400/10"><i class="fas fa-clock"></i></div>
            <div>
                <div id="serverTime" class="text-xl font-bold">00:00:00</div>
                <div class="text-[10px] uppercase tracking-wider text-gray-500">Server Time</div>
            </div>
        </div>
    </div>

    <div id="categoryTabs" class="flex flex-wrap gap-3 mb-8">
        <button class="tab-btn active" onclick="filterCategory('all')"><i class="fas fa-cubes"></i> All Endpoints</button>
    </div>

    <div class="terminal-window mb-10">
        <div class="terminal-header">
            <div class="dot bg-[#ff5f56]"></div>
            <div class="dot bg-[#ffbd2e]"></div>
            <div class="dot bg-[#27c93f]"></div>
            <span class="ml-auto text-[10px] text-gray-500 font-mono">terminal — search</span>
        </div>
        <div class="flex items-center px-4">
            <span class="text-green-500 font-mono text-sm mr-2">root@Skyzopedia:~$</span>
            <input type="text" id="searchInput" placeholder="search endpoints..." class="input-modern">
        </div>
    </div>

    <div id="content">
        <div id="noResults" class="hidden text-center py-20">
            <p class="text-sm text-gray-500">No matching endpoint found.</p>
        </div>
        
        <div id="apiList" class="flex flex-col gap-2">
            </div>
    </div>

</main>

<a id="contactCustomerBtn" href="#" target="_blank" class="contact-customer">
    <i class="fas fa-comment text-white text-xl"></i>
</a>

<script src="/script.js"></script>

<script>
    // Logic Jam
    function updateClock() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('en-GB');
        const clockEl = document.getElementById('serverTime');
        if(clockEl) clockEl.innerText = timeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    /**
     * FIX UNTUK METODE & EXAMPLE YANG HILANG
     * Fungsi ini harus bisa menangani elemen yang baru dibuat secara dinamis oleh JS
     */
    function switchTab(el, target) {
        // Cari container API Content terdekat dari tombol tab yang diklik
        const parent = el.closest('.api-content');
        if(!parent) return;

        console.log("Switching tab to:", target); // Debugging

        // 1. Reset semua tab trigger di dalam card ini
        const triggers = parent.querySelectorAll('.tab-trigger');
        triggers.forEach(t => t.classList.remove('active'));
        
        // 2. Aktifkan tab yang diklik
        el.classList.add('active');

        // 3. Cari panel konten
        const methodPane = parent.querySelector('.tab-pane-method');
        const examplePane = parent.querySelector('.tab-pane-example');

        // 4. Mainkan visibility
        if(target === 'method') {
            if(methodPane) methodPane.classList.remove('hidden');
            if(examplePane) examplePane.classList.add('hidden');
        } else {
            if(methodPane) methodPane.classList.add('hidden');
            if(examplePane) examplePane.classList.remove('hidden');
        }
    }

    // Filter Kategori
    function filterCategory(catName) {
        const btns = document.querySelectorAll('.tab-btn');
        btns.forEach(b => b.classList.remove('active'));
        if(event) event.currentTarget.classList.add('active');
        
        if (typeof window.filterEndpoints === 'function') {
            window.filterEndpoints(catName);
        }
    }

    // Loading Screen Removal
    window.addEventListener('load', () => {
        setTimeout(() => {
            const ls = document.getElementById('loadingScreen');
            if(ls) {
                ls.style.opacity = '0';
                setTimeout(() => ls.remove(), 500);
            }
        }, 1000);
    });
</script>

</body>
    </html>
