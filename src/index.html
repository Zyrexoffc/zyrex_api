<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050810">
    <meta name="description" content="Kurokami REST API Platform - High Performance">
    <title>ZYREX - REST API</title>

    <link rel="icon" href="https://file.idnet.my.id/api/preview.php?file=nnjwax6t.jpg" type="image/png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        space: ['Space Grotesk', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg-dark: #050810;
            --glass: rgba(15, 23, 42, 0.7);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%);
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.5;
            filter: blur(80px);
            pointer-events: none;
        }

        .mesh-ball {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(0, 0); }
            to { transform: translate(100vw, 100vh); }
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
        }

        .glass-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 32px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent, rgba(168, 85, 247, 0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .hologram-box {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        .hologram-box::after {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 2px);
            pointer-events: none;
        }

        .btn-cyber {
            position: relative;
            padding: 16px 24px;
            border-radius: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-cyber-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
        }

        .btn-cyber-outline {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: #cbd5e1;
        }

        .btn-cyber:hover {
            transform: translateY(-5px) scale(1.02);
            filter: brightness(1.1);
        }

        .glow-text {
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .float { animation: floating 3s ease-in-out infinite; }
        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>

<body>

    <div id="main-content" class="w-full max-w-xl mx-auto p-6" style="display: block;">
        <div class="mesh-bg">
            <div class="mesh-ball" style="width: 400px; height: 400px; top: -100px; left: -100px;"></div>
            <div class="mesh-ball" style="width: 300px; height: 300px; bottom: 10%; right: 10%; animation-delay: -5s;"></div>
        </div>

        <div class="max-w-xl w-full py-12">
            <div class="glass-card p-1"> 
                <div class="px-8 pt-6 flex justify-between items-center">
                    <div class="flex gap-1.5">
                        <div class="w-3 h-3 rounded-full bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.5)]"></div>
                        <div class="w-3 h-3 rounded-full bg-yellow-500 shadow-[0_0_10px_rgba(245,158,11,0.5)]"></div>
                        <div class="w-3 h-3 rounded-full bg-green-500 shadow-[0_0_10px_rgba(34,197,94,0.5)]"></div>
                    </div>
                    <div id="status-indicator" class="status-pill">
                        <span class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                        </span>
                        System Active
                    </div>
                </div>

                <div class="p-8 text-center">
                    <div id="welcome-text" class="font-space text-sm font-bold tracking-[0.3em] text-indigo-400 mb-6 uppercase">
                        WELCOME TO REST API
                    </div>

                    <div class="hologram-box mb-8 float">
                        <img src="https://files.catbox.moe/185i1y.jpg" class="w-full h-56 object-cover transform scale-105 hover:scale-110 transition-transform duration-700">
                        <div class="absolute top-4 left-4 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-xl border border-white/10 text-[10px] font-bold tracking-widest uppercase">
                            Rest Api v1.0
                        </div>
                    </div>

                    <h1 class="font-space text-4xl md:text-5xl font-bold mb-4 glow-text tracking-tighter">
                        ZYREX<span class="text-indigo-500">.</span>API
                    </h1>

                    <p class="text-slate-400 text-sm leading-relaxed mb-10 font-light px-4">
                        The next-gen REST API infrastructure. Engineered for <span class="text-white font-semibold">speed</span>, 
                        designed for <span class="text-white font-semibold">stability</span>, and built for the 
                        <span class="text-indigo-400 font-semibold underline decoration-indigo-500/30 underline-offset-4">future of development</span>.
                    </p>

                    <div class="grid grid-cols-2 gap-4">
                        <a href="docs.html" class="btn-cyber btn-cyber-primary col-span-2 md:col-span-1">
                            <i class="fas fa-terminal text-sm"></i> Explore Docs
                        </a>
                        <a href="Stat.html" class="btn-cyber btn-cyber-outline col-span-2 md:col-span-1">
                            <i class="fas fa-chart-line text-sm"></i> Analytics
                        </a>
                        <a href="info.html" class="btn-cyber btn-cyber-primary col-span-2">
                            <i class="fas fa-info-circle text-sm"></i> System Info
                        </a>
                        
                        <div class="flex gap-4 col-span-2 mt-2">
                            <a href="#" class="btn-cyber btn-cyber-outline flex-1 group">
                                <i class="fab fa-whatsapp text-green-400 text-xl group-hover:scale-125 transition-transform"></i>
                            </a>
                            <a href="#" class="btn-cyber btn-cyber-outline flex-1 group">
                                <i class="fas fa-share-nodes text-indigo-400 text-xl group-hover:scale-125 transition-transform"></i>
                            </a>
                            <a href="#" class="btn-cyber btn-cyber-outline flex-1 group">
                                <i class="fab fa-github text-white text-xl group-hover:scale-125 transition-transform"></i>
                            </a>
                        </div>
                    </div>
                </div>

                <div class="pb-6 text-center">
                    <p class="text-[9px] uppercase tracking-[0.5em] text-slate-600 font-bold">
                        &copy; 2026 ZYREX API • NO COPYRIGHT 
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Langsung panggil animasi teks dan card utama karena verifikasi dihapus
            initMainAnimations();

            function initMainAnimations() {
                const card = document.querySelector("#main-content .glass-card");
                anime({
                    targets: card,
                    opacity: [0, 1],
                    translateY: [50, 0],
                    easing: 'easeOutExpo',
                    duration: 1500,
                    delay: 100
                });

                const welcomeTag = document.querySelector("#welcome-text");
                const text = "WELCOME TO REST API";
                welcomeTag.innerHTML = text.split("").map(c => `<span>${c === " " ? "&nbsp;" : c}</span>`).join("");

                anime({
                    targets: '#welcome-text span',
                    translateY: [10, 0],
                    opacity: [0, 1],
                    delay: anime.stagger(100),
                    loop: true,
                    direction: 'alternate',
                    easing: 'easeInOutQuad',
                    duration: 2000
                });
            }

            setInterval(() => {
                const statusBox = document.querySelector("#status-indicator");
                if(!statusBox) return;
                const rand = Math.random();
                if(rand > 0.95) {
                    statusBox.innerHTML = `● DISTURBANCE`;
                    statusBox.style.color = "#f87171";
                    statusBox.style.background = "rgba(248,113,113,0.1)";
                    statusBox.style.borderColor = "rgba(248,113,113,0.2)";
                } else {
                    statusBox.innerHTML = `
                        <span class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                        </span>
                        System Active`;
                    statusBox.style.color = "#4ade80";
                    statusBox.style.background = "rgba(34,197,94,0.1)";
                    statusBox.style.borderColor = "rgba(34,197,94,0.2)";
                }
            }, 5000);

            document.querySelectorAll(".btn-cyber").forEach(btn => {
                btn.addEventListener("click", function(e) {
                    let rect = e.currentTarget.getBoundingClientRect();
                    let x = e.clientX - rect.left;
                    let y = e.clientY - rect.top;
                    let ripple = document.createElement("span");
                    ripple.style.position = "absolute";
                    ripple.style.left = x + "px";
                    ripple.style.top = y + "px";
                    ripple.style.width = "0";
                    ripple.style.height = "0";
                    ripple.style.background = "rgba(255,255,255,0.3)";
                    ripple.style.borderRadius = "50%";
                    ripple.style.transform = "translate(-50%, -50%)";
                    ripple.style.transition = "width 0.5s, height 0.5s, opacity 0.5s";
                    ripple.style.pointerEvents = "none";
                    this.appendChild(ripple);
                    setTimeout(() => {
                        ripple.style.width = "300px";
                        ripple.style.height = "300px";
                        ripple.style.opacity = "0";
                    }, 0);
                    setTimeout(() => ripple.remove(), 500);
                });
            });
        });
    </script>
</body>
    </html>
