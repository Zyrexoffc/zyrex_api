<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZYREX - Device Identity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body { background: #050810; color: #fff; font-family: 'monospace'; }
        .scan-line { width: 100%; height: 2px; background: rgba(99, 102, 241, 0.5); position: absolute; animation: scan 3s infinite; z-index: 10; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .info-label { color: #6366f1; font-weight: bold; text-transform: uppercase; font-size: 0.7rem; }
        .info-value { color: #4ade80; font-size: 1rem; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="scan-line"></div>
    
    <div class="max-w-md w-full bg-slate-900/50 border border-indigo-500/30 rounded-2xl p-6 backdrop-blur-xl relative overflow-hidden">
        <h2 class="text-center text-indigo-400 font-bold tracking-[0.3em] mb-6 uppercase">Device Information</h2>
        
        <div class="space-y-4">
            <div class="border-b border-white/5 pb-2">
                <p class="info-label">IP Address</p>
                <p id="ip-addr" class="info-value italic italic">Detecting...</p>
            </div>
            <div class="border-b border-white/5 pb-2">
                <p class="info-label">Region / City</p>
                <p id="location" class="info-value">Locating...</p>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="border-b border-white/5 pb-2">
                    <p class="info-label">Browser</p>
                    <p id="browser" class="info-value text-xs font-mono">-</p>
                </div>
                <div class="border-b border-white/5 pb-2">
                    <p class="info-label">Battery</p>
                    <p id="battery" class="info-value">-</p>
                </div>
            </div>

            <div class="border-b border-white/5 pb-2">
                <p class="info-label">Hardware Signature</p>
                <p id="platform" class="info-value text-xs">-</p>
            </div>
        </div>

        <button onclick="window.history.back()" class="mt-8 w-full py-3 bg-indigo-600/20 border border-indigo-500/50 rounded-xl text-xs hover:bg-indigo-600/40 transition-all uppercase tracking-widest">
            Return to Core
        </button>
    </div>

    <script>
        async function getDeviceInfo() {
            // 1. Get IP and Location (Using Public API ipapi.co)
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                document.getElementById('ip-addr').innerText = data.ip;
                document.getElementById('location').innerText = `${data.city}, ${data.region}`;
            } catch (err) {
                document.getElementById('ip-addr').innerText = "Blocked by AdBlock";
            }

            // 2. Browser & Platform Info
            document.getElementById('browser').innerText = navigator.userAgent.split(' ').slice(-1);
            document.getElementById('platform').innerText = navigator.platform + " / " + navigator.vendor;

            // 3. Battery Info
            if ('getBattery' in navigator) {
                navigator.getBattery().then(function(battery) {
                    function updateBattery() {
                        const level = Math.round(battery.level * 100) + "%";
                        const charging = battery.charging ? " (Charging)" : "";
                        document.getElementById('battery').innerText = level + charging;
                    }
                    updateBattery();
                    battery.addEventListener('levelchange', updateBattery);
                    battery.addEventListener('chargingchange', updateBattery);
                });
            } else {
                document.getElementById('battery').innerText = "Not Supported";
            }
        }

        window.onload = getDeviceInfo;
    </script>
</body>
</html>
